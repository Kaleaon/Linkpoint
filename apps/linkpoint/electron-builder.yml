appId: io.linkpoint.viewer
productName: Linkpoint
copyright: Copyright © Linkpoint contributors
asar: true

directories:
  output: build-desktop

files:
  - dist/**/*
  - electron/**/*
  - core/**/*
  - package.json
  - '!node_modules/react/**/*'
  - '!node_modules/vite/**/*'
  - '!node_modules/vitest/**/*'

extraMetadata:
  main: electron/main.cjs

artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'

portable:
  artifactName: '${productName}-${version}-windows-${arch}-portable.${ext}'

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  writeUpdateInfo: false

linux:
  category: Network
  synopsis: Second Life communicator and viewer utility suite
  maintainer: Linkpoint Contributors <noreply@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
