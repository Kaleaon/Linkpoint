name: Bug Report
description: File a bug report to help us improve Linkpoint
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
      
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
      
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of Linkpoint are you running?
      options:
        - 1.0.0 (Latest)
        - 0.x.x (Development)
        - Other
    validations:
      required: true
      
  - type: dropdown
    id: device-type
    attributes:
      label: Device Type
      description: What type of device are you using?
      options:
        - Phone
        - Tablet
        - Chromebook
        - Android TV
        - Emulator
    validations:
      required: true
      
  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: What version of Android are you running?
      placeholder: "e.g., Android 14 / API 34"
    validations:
      required: true
      
  - type: input
    id: device-model
    attributes:
      label: Device Model
      description: What device model are you using?
      placeholder: "e.g., Pixel 7 Pro, Samsung Galaxy S23"
    validations:
      required: false
      
  - type: dropdown
    id: grid
    attributes:
      label: Grid
      description: Which grid were you connecting to?
      options:
        - Second Life
        - Second Life Beta (Aditi)
        - OSGrid
        - Kitely
        - Other OpenSim grid
    validations:
      required: true
      
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell
      
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
