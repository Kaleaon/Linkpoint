name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install required Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "Installed SDK packages:"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            build/reports/lint-results-*.html
            build/reports/lint-results-*.xml

      - name: Comment Lint Results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lintResultsPath = 'build/reports/lint-results-debug.xml';
            if (fs.existsSync(lintResultsPath)) {
              const lintResults = fs.readFileSync(lintResultsPath, 'utf8');
              const issueCount = (lintResults.match(/<issue/g) || []).length;
              const body = `### 🔍 Lint Check Results\n\nFound ${issueCount} lint issues. Check the [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Analyze Kotlin code metrics
        run: |
          echo "Analyzing Linkpoint Kotlin codebase..."
          TOTAL_KOTLIN=$(find src -name "*.kt" 2>/dev/null | wc -l)
          TOTAL_LINES=$(find src -name "*.kt" -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
          echo "Total Kotlin files: $TOTAL_KOTLIN"
          echo "Total lines of code: $TOTAL_LINES"
          
          echo "## 📈 Code Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Kotlin files:** $TOTAL_KOTLIN" >> $GITHUB_STEP_SUMMARY
          echo "- **Total lines of code:** $TOTAL_LINES" >> $GITHUB_STEP_SUMMARY
