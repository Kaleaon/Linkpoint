plugins {
    id 'com.android.application'
    // Kotlin support enabled for advanced LLSD features (@Kaleaon's implementation)
    id 'org.jetbrains.kotlin.android'
    // Kotlin annotation processing for Room (when Room is properly configured)
    // Note: kapt plugin disabled - not currently needed, can be re-enabled for Room/Hilt later
    // id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.lumiyaviewer.lumiya'

    // SDK configuration: MinSDK 24, Target/Compile SDK 34 for AGP 8.1.4
    compileSdk 34
    buildToolsVersion "34.0.0"

    // Resource processing tweaks (keep minimal). noCompress keeps ktx2 files uncompressed.
    aaptOptions {
        noCompress 'ktx2'
    }

    defaultConfig {
        applicationId "com.lumiyaviewer.lumiya"
        minSdk 24
        targetSdk 34
        versionCode 67
        versionName "3.4.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // NDK filters (we're not building native yet, but keep ABI consistent)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Signing configurations for release builds
    signingConfigs {
        debug {
            // Default debug signing configuration provided by Android SDK
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                
                signingConfig signingConfigs.create("release") {
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
                println "✅ Using production keystore for release build"
            } else {
                signingConfig signingConfigs.debug
                println "⚠️  WARNING: Using debug signing for release build (NOT suitable for Play Store)"
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingDefaultResource'
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ['-opt-in=kotlin.RequiresOptIn']
    }
    
    buildFeatures {
        compose true
        buildConfig true
    }
    
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.10'
    }

    packagingOptions {
        pickFirst '**/libjnidispatch.so'
        pickFirst '**/libopenjpeg.so'
        pickFirst '**/liblumiya-native.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE*'
        exclude 'META-INF/NOTICE*'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
        exclude 'META-INF/*.kotlin_module'
        merge 'META-INF/services/**'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            kotlin.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']

            def javaExcludePatterns = [
                '**/$Lambda$*.java',
                '**/*$Lambda$*.java',
                '**/vivox/**/*.java',
                '**/vivox/**/*.kt',
                '**/modern/protocol/**/*.java',
                '**/modern/chat/**/*.java',
                '**/modern/demos/**/*.java',
                '**/modern/connection/**/*.java',
                '**/modern/samples/ModernLinkpointDemo.java',
                '**/modern/features/**/*.java',
                '**/ui/modern/**/*.java',
                '**/slproto/types/CameraParams.java'
            ]
            java.excludes = javaExcludePatterns
            kotlin.excludes = javaExcludePatterns.collect { pattern ->
                pattern.contains('.java') ? pattern.replace('.java', '.kt') : pattern
            }.unique()
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.gms:play-services-drive:17.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-base:18.5.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'androidx.media:media:1.7.0'

    implementation 'lindenlab:llsd:1.0'
    
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.astuetz:pagerslidingtabstrip:1.0.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom
    
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    
    implementation 'com.google.android.filament:filament-android:1.66.0'
    implementation 'com.google.android.filament:filament-utils-android:1.66.0'
    implementation 'com.google.android.filament:gltfio-android:1.66.0'
    implementation 'com.google.android.filament:filamat-android:1.66.0'

    // Dependency Injection
    implementation 'javax.inject:javax.inject:1'

    // GreenDAO
    implementation 'de.greenrobot:greendao:2.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    configurations.all {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'android.arch.lifecycle', module: 'common'
        exclude group: 'com.android.support'
        exclude group: 'com.android.support', module: 'support-annotations'
        exclude group: 'com.android.support', module: 'support-v4'
        exclude group: 'com.android.support', module: 'appcompat-v7'
        exclude group: 'com.android.support', module: 'design'
        exclude group: 'com.android.support', module: 'support-compat'

        resolutionStrategy {
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'com.google.android.material:material:1.12.0'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.activity:activity-ktx:1.9.3'
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        }
    }
}
