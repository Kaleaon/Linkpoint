name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Task 1 - Pre-Commit & Code Formatting Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Ruff and pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install ruff pre-commit

      - name: Run Ruff static analysis
        run: ruff check scripts/ tools/

      - name: Run Ruff format check
        run: ruff format --check scripts/ tools/

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  android:
    name: Task 2 - Android Kotlin Build & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmake;3.22.1
            ndk;26.3.11579264

      - name: Grant execute permission for gradlew
        run: chmod +x legacy/gradlew legacy/Linkpoint/gradlew 2>/dev/null || true

      - name: Validate parity snapshot clean-tree guards
        run: bash scripts/check_parity_snapshot_guards.sh

      - name: Validate no decompilation artifacts
        run: bash scripts/check_no_decompilation_artifacts.sh

      - name: Run UI route and theme coverage checks
        run: |
          bash scripts/ui/check-route-coverage.sh
          bash scripts/ui/check-theme-coverage.sh
          bash scripts/ui/check-migration-matrix.sh

      - name: Run unit tests and lint
        run: (cd legacy && ./gradlew :Linkpoint:testStableDebugUnitTest :Linkpoint:lintStableDebug jacocoTestReport --stacktrace)

      - name: Run Roborazzi Visual Snapshot Verification
        run: (cd legacy && ./gradlew verifyRoborazziDebug)

      - name: Upload Roborazzi Visual Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: legacy/Linkpoint/build/outputs/roborazzi/

      - name: Assemble Debug build
        run: (cd legacy && ./gradlew :Linkpoint:assembleDebug --stacktrace)

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linkpoint-debug-${{ github.sha }}
          path: legacy/Linkpoint/build/outputs/apk/*/debug/*.apk
          retention-days: 14

      - name: Upload Android coverage report
        uses: actions/upload-artifact@v4
        with:
          name: android-coverage
          path: legacy/Linkpoint/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          if-no-files-found: ignore

  web:
    name: Task 3 - React & Web Workspace Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Check viewer contract
        run: bash scripts/check_viewer_contract.sh

      - name: Verify i18n locale key parity
        run: node scripts/sync-i18n.js --check

      - name: Run web workspace validation
        run: npm run check:web

      - name: Upload Web coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Playwright visual tests
        run: npm run test:visual

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/linkpoint/test-results/
            packages/design-system/test-results/

  rust:
    name: Task 4 - Rust Core Workspace Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        continue-on-error: true

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests with coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: ignore

  protocol:
    name: Task 5 - Protocol Conformance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Grant execute permissions
        run: chmod +x legacy/Linkpoint/tools/protocol/*.sh legacy/Linkpoint/tools/protocol/*.py 2>/dev/null || true

      - name: Run protocol conformance suite
        run: legacy/Linkpoint/tools/protocol/run_conformance.sh --skip-gradle

  dart:
    name: Task 6 - Dart Package Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Build native protocol shared library
        run: cargo build -p linkpoint-protocol --release

      - name: Verify Dart formatting
        run: |
          cd packages/linkpoint_dart
          dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyze
        run: |
          cd packages/linkpoint_dart
          flutter analyze

      - name: Run Dart / Flutter tests
        run: |
          cd packages/linkpoint_dart
          flutter test

  ci-status:
    name: Task 7 - CI Status & Coverage Quality Gate
    runs-on: ubuntu-latest
    needs: [pre-commit, android, web, rust, protocol, dart]
    if: "!cancelled()"
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-coverage"
          merge-multiple: false
          path: coverage-artifacts
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Evaluate Coverage Quality Gate
        run: |
          if [ -f scripts/evaluate_coverage.py ]; then
            python3 scripts/evaluate_coverage.py \
              --android-report coverage-artifacts/android-coverage/jacocoTestReport.xml \
              --web-report coverage-artifacts/web-coverage/lcov.info \
              --rust-report coverage-artifacts/rust-coverage/lcov.info
          fi

      - name: Evaluate job status
        env:
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WEB_RESULT: ${{ needs.web.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          DART_RESULT: ${{ needs.dart.result }}
        run: |
          if [[ "$PRE_COMMIT_RESULT" != "success" || "$ANDROID_RESULT" != "success" || "$WEB_RESULT" != "success" || "$RUST_RESULT" != "success" || "$PROTOCOL_RESULT" != "success" || "$DART_RESULT" != "success" ]]; then
            echo "One or more required CI build jobs failed."
            exit 1
          fi
          echo "All required CI jobs and quality gates passed."
