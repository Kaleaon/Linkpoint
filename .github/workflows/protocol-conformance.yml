name: Protocol Conformance

on:
  push:
    branches: [ main, develop, 'claude/**', 'cursor/**', 'copilot/**' ]
    paths:
      - 'Linkpoint/src/**'
      - 'Linkpoint/tools/protocol/**'
      - 'docs/AGENT_PARSABLE_MODERNIZATION_TASKLIST.md'
      - '.github/workflows/protocol-conformance.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Linkpoint/src/**'
      - 'Linkpoint/tools/protocol/**'
      - 'docs/AGENT_PARSABLE_MODERNIZATION_TASKLIST.md'
      - '.github/workflows/protocol-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-gate:
    name: Offline conformance gate (no JDK)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run offline conformance layers
        run: |
          set -euo pipefail
          chmod +x Linkpoint/tools/protocol/sync_master_template.sh \
                   Linkpoint/tools/protocol/run_conformance.sh \
                   Linkpoint/tools/protocol/verify_message_template_conformance.py \
                   Linkpoint/tools/protocol/verify_protocol_docs.py
          Linkpoint/tools/protocol/run_conformance.sh --skip-gradle

      - name: Upload offline conformance reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: protocol-conformance-offline
          path: Linkpoint/build/reports/protocol/
          if-no-files-found: warn

  jvm-suite:
    name: JVM conformance suite
    needs: offline-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_VERSION: '17'
      ANDROID_SDK_VERSION: '35'
      NDK_VERSION: '26.3.11579264'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277 # v3.2.1
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_SDK_VERSION }}
            build-tools;35.0.0
            cmake;3.22.1
            ndk;${{ env.NDK_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            .gradle
          key: ${{ runner.os }}-gradle-conformance-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-conformance-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for tooling
        run: |
          chmod +x gradlew Linkpoint/gradlew
          chmod +x Linkpoint/tools/protocol/*.sh Linkpoint/tools/protocol/*.py

      - name: Run unified conformance suite
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: Linkpoint/tools/protocol/run_conformance.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: protocol-conformance-full
          path: |
            Linkpoint/build/reports/protocol/
            Linkpoint/build/reports/tests/
          if-no-files-found: warn

