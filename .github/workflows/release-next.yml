name: Release Linkpoint Next preview
on:
  push:
    tags: ["next-v*"]
permissions:
  contents: read
jobs:
  release-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run check
      - name: Create locked web artifact and inventories
        run: |
          set -euo pipefail
          mkdir -p release
          VITE_BASE_PATH=/Linkpoint/ npm run build
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf release/linkpoint-web-${GITHUB_REF_NAME}.tar.gz -C apps/linkpoint/dist .
          npm sbom --sbom-format=cyclonedx > release/linkpoint-web-${GITHUB_REF_NAME}.cdx.json
          cargo metadata --locked --format-version=1 > release/linkpoint-rust-${GITHUB_REF_NAME}.metadata.json
          sha256sum release/* > release/SHA256SUMS
          cp release/SHA256SUMS release/checksums.sha256
      - uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with: { subject-path: "release/linkpoint-web-*.tar.gz" }
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          prerelease: true
          files: release/*

