name: Deploy Linkpoint

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
          - beta

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '35'
  NDK_VERSION: '26.3.11579264'

jobs:
  build-release:
    name: Build Release (${{ matrix.target }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [stable, xrExperimental]
        arch: [arm64-v8a, universal]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'
    
    # setup-android@v3 only accepts `packages` / `cmdline-tools-version` /
    # license toggles. The legacy api-level/build-tools/cmake/ndk inputs are
    # silently dropped, which previously meant deploys ran without an NDK.
    - name: Setup Android SDK
      uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277 # v3.2.1
      with:
        packages: >-
          platform-tools
          platforms;android-${{ env.ANDROID_SDK_VERSION }}
          build-tools;35.0.0
          cmake;3.22.1
          ndk;${{ env.NDK_VERSION }}

    - name: Verify Android SDK install
      run: |
        set -euo pipefail
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        test -d "$ANDROID_SDK_ROOT/platforms/android-${{ env.ANDROID_SDK_VERSION }}"
        test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
        test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
        test -d "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"
    
    - name: Cache Gradle packages
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
          Linkpoint/.gradle
        key: ${{ runner.os }}-gradle-release-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-release-${{ matrix.target }}-${{ matrix.arch }}-
          ${{ runner.os }}-gradle-
    
    - name: Decode keystore
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > Linkpoint/release.keystore
    
    - name: Create keystore.properties
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        cat > Linkpoint/keystore.properties << EOF
        storeFile=release.keystore
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF
    
    - name: Grant execute permission for gradlew
      run: |
        cd Linkpoint
        chmod +x gradlew
    
    - name: Extract version info
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_name=${VERSION#v}" >> $GITHUB_OUTPUT
        echo "version_code=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Update version in build.gradle.kts
      env:
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
        VERSION_CODE: ${{ steps.version.outputs.version_code }}
      run: |
        cd Linkpoint
        sed -i "s/versionName = \".*\"/versionName = \"$VERSION_NAME\"/" build.gradle.kts
        sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" build.gradle.kts
    
    - name: Clean build
      run: |
        cd Linkpoint
        ./gradlew clean --stacktrace
    
    - name: Build Release APK and AAB (${{ matrix.target }}-${{ matrix.arch }})
      run: |
        cd Linkpoint
        FLAVOR_TASK="assemble$(tr 'a-z' 'A-Z' <<< ${matrix.target:0:1})${matrix.target:1}Release"
        AAB_TASK="bundle$(tr 'a-z' 'A-Z' <<< ${matrix.target:0:1})${matrix.target:1}Release"
        ./gradlew "$FLAVOR_TASK" "$AAB_TASK" --stacktrace --info --no-daemon
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    
    - name: Prepare isolated matrix artifacts and SHA-256 checksums
      env:
        TARGET_ARCH: ${{ matrix.target }}-${{ matrix.arch }}
        VER_NAME: ${{ steps.version.outputs.version_name }}
      run: |
        set -euo pipefail
        mkdir -p Linkpoint/build/outputs/dist
        cd Linkpoint/build/outputs
        
        # Copy and rename APKs with matrix target and arch identifiers
        find apk/ -name "*.apk" -type f | while read -r apk; do
          dest="dist/linkpoint-${TARGET_ARCH}-${VER_NAME}.apk"
          cp "$apk" "$dest"
        done

        # Copy and rename AABs with matrix target and arch identifiers
        find bundle/ -name "*.aab" -type f | while read -r aab; do
          dest="dist/linkpoint-${TARGET_ARCH}-${VER_NAME}.aab"
          cp "$aab" "$dest"
        done

        # Compute SHA-256 checksum manifest for all generated binaries
        cd dist
        sha256sum linkpoint-${TARGET_ARCH}-* > SHA256SUMS
        cp SHA256SUMS checksums.sha256
        cat SHA256SUMS

    - name: Attest build provenance (SLSA Level 3)
      uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
      with:
        subject-path: |
          Linkpoint/build/outputs/dist/*.apk
          Linkpoint/build/outputs/dist/*.aab
    
    - name: Upload Release Artifacts (${{ matrix.target }}-${{ matrix.arch }})
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: linkpoint-release-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}
        path: |
          Linkpoint/build/outputs/dist/*
        retention-days: 90
        compression-level: 9
    
    - name: Upload mapping files
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      if: success()
      with:
        name: mapping-files-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}
        path: |
          Linkpoint/build/outputs/mapping/
        retention-days: 90
      continue-on-error: true

  deploy-github:
    name: Deploy to GitHub Releases
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write
      attestations: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    
    - name: Extract version info
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Download Release Artifacts
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        path: raw-artifacts/
    
    - name: Consolidate binaries and generate SHA256SUMS manifest
      run: |
        set -euo pipefail
        mkdir -p artifacts
        find raw-artifacts/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} artifacts/ \;
        cd artifacts
        sha256sum *.apk *.aab > SHA256SUMS
        cp SHA256SUMS checksums.sha256
        cat SHA256SUMS

    - name: Attest build provenance (SLSA Level 3)
      uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
      with:
        subject-path: |
          artifacts/*.apk
          artifacts/*.aab
    
    - name: Generate changelog
      id: changelog
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if [ -f CHANGELOG.md ]; then
          VERSION_ESCAPED=$(printf '%s\n' "$VERSION" | sed 's/[][\\.^$*+?(){}|/-]/\\&/g')
          awk -v version="$VERSION_ESCAPED" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; print; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "## $VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "- No dedicated changelog section found; using generated commit summary." >> release_notes.md
            git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD >> release_notes.md
          fi
        else
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD > release_notes.md
        fi

        if ! grep -Eiq '^[#]{2,3}[[:space:]]+UI migration deltas' release_notes.md; then
          echo "" >> release_notes.md
          if [ -f docs/ui-refactor/changelog-template.md ]; then
            cat docs/ui-refactor/changelog-template.md >> release_notes.md
          fi
        fi
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
      with:
        files: |
          artifacts/*
        tag_name: ${{ steps.version.outputs.version }}
        name: Linkpoint ${{ steps.version.outputs.version }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    needs: build-release
    runs-on: ubuntu-latest
    if: ${{ secrets.FIREBASE_APP_ID != '' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Extract version info
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
          ENVIRONMENT="${{ github.event.inputs.environment }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
          ENVIRONMENT="production"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
    
    - name: Download Release Artifacts
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        path: artifacts/
    
    - name: Upload to Firebase App Distribution
      uses: wzieba/Firebase-Distribution-Github-Action@a41b2f7ab3f7c2631b6a73fb2f660b517cef45a9 # v1.7.0
      with:
        appId: ${{ secrets.FIREBASE_APP_ID }}
        serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        groups: ${{ steps.version.outputs.environment == 'production' && 'production-testers' || 'beta-testers' }}
        file: artifacts/**/*.apk
        releaseNotes: |
          Version: ${{ steps.version.outputs.version }}
          Environment: ${{ steps.version.outputs.environment }}
          
          See full release notes at: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}

  notify:
    name: Notify Deployment
    needs: [deploy-github, deploy-firebase]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    
    steps:
    - name: Extract version info
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Deployment Summary
      run: |
        echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-github.result }}" == "success" ]; then
          echo "✅ GitHub Releases: Deployed" >> $GITHUB_STEP_SUMMARY
          echo "   - [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ GitHub Releases: Failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.deploy-firebase.result }}" == "success" ]; then
          echo "✅ Firebase App Distribution: Deployed" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-firebase.result }}" == "skipped" ]; then
          echo "⏭️ Firebase App Distribution: Skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Firebase App Distribution: Failed" >> $GITHUB_STEP_SUMMARY
        fi

