name: Verify PWA Build

on:
  push:
    paths:
      - 'PWA-demo/**'
  pull_request:
    paths:
      - 'PWA-demo/**'
  workflow_dispatch:

jobs:
  verify:
    name: Verify PWA Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify build configuration
      run: |
        cd PWA-demo
        chmod +x verify-build.sh
        ./verify-build.sh
    
    - name: Test local server
      run: |
        cd PWA-demo
        # Start HTTP server in background
        python3 -m http.server 8000 &
        SERVER_PID=$!
        
        # Wait for server to start
        sleep 2
        
        # Test that index.html is accessible
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/index.html)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ index.html is accessible (HTTP $HTTP_CODE)"
        else
          echo "❌ index.html returned HTTP $HTTP_CODE"
          kill $SERVER_PID
          exit 1
        fi
        
        # Test manifest.json
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/manifest.json)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ manifest.json is accessible (HTTP $HTTP_CODE)"
        else
          echo "❌ manifest.json returned HTTP $HTTP_CODE"
          kill $SERVER_PID
          exit 1
        fi
        
        # Test service-worker.js
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/service-worker.js)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ service-worker.js is accessible (HTTP $HTTP_CODE)"
        else
          echo "❌ service-worker.js returned HTTP $HTTP_CODE"
          kill $SERVER_PID
          exit 1
        fi
        
        # Test CSS
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/css/styles.css)
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ CSS is accessible (HTTP $HTTP_CODE)"
        else
          echo "❌ CSS returned HTTP $HTTP_CODE"
          kill $SERVER_PID
          exit 1
        fi
        
        # Stop server
        kill $SERVER_PID
        echo ""
        echo "✅ All static assets are accessible!"
    
    - name: Validate JSON files
      run: |
        cd PWA-demo
        echo "Validating JSON files..."
        
        # Validate manifest.json
        if python3 -m json.tool manifest.json > /dev/null 2>&1; then
          echo "✅ manifest.json is valid JSON"
        else
          echo "❌ manifest.json has invalid JSON syntax"
          exit 1
        fi
        
        # Validate vercel.json
        if python3 -m json.tool vercel.json > /dev/null 2>&1; then
          echo "✅ vercel.json is valid JSON"
        else
          echo "❌ vercel.json has invalid JSON syntax"
          exit 1
        fi
        
        # Validate package.json
        if python3 -m json.tool package.json > /dev/null 2>&1; then
          echo "✅ package.json is valid JSON"
        else
          echo "❌ package.json has invalid JSON syntax"
          exit 1
        fi
    
    - name: Check JavaScript syntax
      run: |
        cd PWA-demo
        echo "Checking JavaScript files for syntax errors..."
        
        ERRORS=0
        for js_file in js/*.js; do
          if node --check "$js_file" 2>/dev/null; then
            echo "✅ $js_file"
          else
            echo "❌ $js_file has syntax errors"
            ERRORS=$((ERRORS + 1))
          fi
        done
        
        if [ $ERRORS -eq 0 ]; then
          echo ""
          echo "✅ All JavaScript files are syntactically valid!"
        else
          echo ""
          echo "❌ Found $ERRORS JavaScript file(s) with syntax errors"
          exit 1
        fi
    
    - name: Generate build summary
      if: always()
      run: |
        echo "# PWA Build Verification Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Files Checked" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ index.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ manifest.json" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ service-worker.js" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ vercel.json" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ package.json" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All JavaScript modules" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All CSS files" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All assets" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Ready for Deployment" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The PWA is ready to be deployed to Vercel!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "cd PWA-demo" >> $GITHUB_STEP_SUMMARY
        echo "vercel --prod" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
