name: Security gates
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "17 4 * * 1" }]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/check_npm_audit.mjs
      - run: cargo install cargo-audit --locked
      - run: cargo audit
      - run: cargo install cargo-sbom --locked
      - run: mkdir -p artifacts && (cargo sbom --output-format cyclone_dx_json_1_5 || cargo sbom --output-format cyclonedx_json_1_5) > artifacts/linkpoint.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: security-sbom, path: artifacts/linkpoint.cdx.json }
