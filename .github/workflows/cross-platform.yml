name: Cross-platform workspace

on:
  pull_request:
    paths:
      - "apps/linkpoint/**"
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cross-platform.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/check_viewer_contract.sh
        if: matrix.os == 'ubuntu-latest'
      - run: npm run check:web
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linkpoint-web-${{ github.sha }}
          path: apps/linkpoint/dist
          if-no-files-found: error

  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native-readiness:
    name: Native shell readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report native shell status
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/linkpoint/package.json
          test -f crates/linkpoint-tauri/Cargo.toml
          if [[ -f apps/linkpoint/src-tauri/tauri.conf.json ]]; then
            echo "Tauri shell is present; enable platform packaging jobs."
          else
            echo "::notice::Web and Rust core are testable, but Android/iOS/desktop native packaging is not enabled until apps/linkpoint/src-tauri is generated."
          fi
