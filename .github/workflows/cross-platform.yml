name: Cross-platform workspace

on:
  pull_request:
    paths:
      - "apps/linkpoint/**"
      - "packages/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "platforms/iOS/**"
      - ".github/workflows/cross-platform.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Configure Git line endings and reset working tree
        run: |
          git config --system core.autocrlf false || true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Normalize working tree line endings
        run: |
          git config core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Renormalize line endings
        run: |
          git add --renormalize .
          git reset --hard
          git checkout .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Rust toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/check_viewer_contract.sh
        if: matrix.os == 'ubuntu-latest'
      - run: npm run check:web
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: linkpoint-web-${{ github.sha }}
          path: apps/linkpoint/dist
          if-no-files-found: error

  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Configure Git line endings and reset working tree
        run: |
          git config --system core.autocrlf false || true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Normalize working tree line endings
        run: |
          git config core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Renormalize line endings
        run: |
          git add --renormalize .
          git reset --hard
          git checkout .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: taiki-e/install-action@wasm-bindgen-cli
        if: matrix.os == 'ubuntu-latest'
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install wasm-bindgen CLI
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@wasm-bindgen-cli
      - name: Verify WebAssembly build and size constraint
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build_wasm.sh
      - name: Verify Cross-Compilation Native Libraries
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build_native_libraries.sh

  dart-ffi:
    name: Dart Flutter FFI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Build native protocol shared library
        run: cargo build -p linkpoint-protocol --release
      - name: Run Flutter Dart FFI test suite
        run: |
          cd packages/linkpoint_dart
          flutter pub get
          flutter test

  native-readiness:
    name: Native shell readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Report native shell status
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/linkpoint/package.json
          test -f crates/linkpoint-tauri/Cargo.toml
          if [[ -f apps/linkpoint/src-tauri/tauri.conf.json ]]; then
            echo "Tauri shell is present; enable platform packaging jobs."
          else
            echo "::notice::Web and Rust core are testable, but Android/iOS/desktop native packaging is not enabled until apps/linkpoint/src-tauri is generated."
          fi

  swift-ios:
    name: Swift iOS engine (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Swift Package test suite
        run: |
          cd platforms/iOS
          swift test
