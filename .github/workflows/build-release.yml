name: Android Build (Debug + Release)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '35'
  NDK_VERSION: '26.3.11579264'

jobs:
  build:
    name: Build (${{ matrix.target }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [stable]
        arch: [arm64-v8a, universal]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@00854ea68c109d98c75d956347303bf7c45b0277 # v3.2.1
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_SDK_VERSION }}
            build-tools;35.0.0
            cmake;3.22.1
            ndk;${{ env.NDK_VERSION }}

      - name: Verify Android SDK install
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${{ env.ANDROID_SDK_VERSION }}"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -d "$ANDROID_SDK_ROOT/cmake/3.22.1"
          test -d "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"

      - name: Cache Gradle packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            .gradle
          key: ${{ runner.os }}-gradle-release-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-${{ matrix.target }}-${{ matrix.arch }}-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug
        run: ./gradlew :Linkpoint:assembleDebug --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Build Release
        run: ./gradlew :Linkpoint:assembleRelease --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Compute SHA-256 checksums
        run: |
          set -euo pipefail
          cd Linkpoint/build/outputs/apk
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec sha256sum {} + > checksums.sha256
          cat checksums.sha256

      - name: Attest build provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-path: "Linkpoint/build/outputs/apk/*/release/*.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: Linkpoint-${{ matrix.target }}-${{ matrix.arch }}-debug-APK
          path: Linkpoint/build/outputs/apk/*/debug/*.apk

      - name: Upload Release APK and Checksums
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: Linkpoint-${{ matrix.target }}-${{ matrix.arch }}-release-APK
          path: |
            Linkpoint/build/outputs/apk/*/release/*.apk
            Linkpoint/build/outputs/apk/checksums.sha256

