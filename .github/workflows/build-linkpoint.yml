name: Build Linkpoint

on:
  push:
    branches: [ main, develop, 'cursor/**' ]
    paths:
      - 'Linkpoint/**'
      - '.github/workflows/build-linkpoint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Linkpoint/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        cmake: 3.22.1
        ndk: 25.2.9519653
    
    - name: Grant execute permission for gradlew
      run: |
        cd Linkpoint
        chmod +x gradlew || echo "gradlew not found, will use gradle wrapper from cache"
    
    - name: Create gradlew if missing
      run: |
        cd Linkpoint
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.5
        fi
    
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          Linkpoint/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Validate Gradle wrapper
      run: |
        cd Linkpoint
        ./gradlew --version
    
    - name: Build with Gradle
      run: |
        cd Linkpoint
        ./gradlew clean assembleDebug --stacktrace --info
    
    - name: Run tests
      run: |
        cd Linkpoint
        ./gradlew testDebugUnitTest --continue
      continue-on-error: true
    
    - name: Run lint
      run: |
        cd Linkpoint
        ./gradlew lintDebug
      continue-on-error: true
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: linkpoint-debug-apk
        path: Linkpoint/build/outputs/apk/debug/*.apk
        retention-days: 7
    
    - name: Upload build reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-reports
        path: |
          Linkpoint/build/reports/
          Linkpoint/build/test-results/
        retention-days: 7
    
    - name: Build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f Linkpoint/build/outputs/apk/debug/*.apk ]; then
          echo "✅ APK built successfully" >> $GITHUB_STEP_SUMMARY
          ls -lh Linkpoint/build/outputs/apk/debug/*.apk >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ APK build failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Features Included:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Animesh Support" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Bakes on Mesh (BoM)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Enhanced Environment (EEP)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ PBR Materials" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ WebRTC Voice" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Modern Kotlin Architecture" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download APK
      uses: actions/download-artifact@v3
      with:
        name: linkpoint-debug-apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: "*.apk"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}