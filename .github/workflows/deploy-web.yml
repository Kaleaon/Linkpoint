name: Deploy Linkpoint web preview
on:
  push:
    branches: [main]
    paths: ["apps/linkpoint/**", "packages/**", "package*.json", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate_web_env.mjs
        env: { VITE_BASE_PATH: /Linkpoint/ }
      - run: npm run check:web
      - run: npm run build
        env: { VITE_BASE_PATH: /Linkpoint/ }
      - name: Smoke-test generated entry points
        run: |
          test -s apps/linkpoint/dist/index.html && test -s apps/linkpoint/dist/service-worker.js && test -s apps/linkpoint/dist/manifest.webmanifest
          cd apps/linkpoint/dist && sha256sum * > checksums.sha256 || true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: apps/linkpoint/dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy immutable build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

