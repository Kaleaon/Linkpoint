name: Deploy Linkpoint web preview
on:
  push:
    branches: [main]
    paths: ["apps/linkpoint/**", "packages/**", "package*.json", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/validate_web_env.mjs
        env: { VITE_BASE_PATH: /Linkpoint/ }
      - run: npm run check:web
      - run: npm run build
        env: { VITE_BASE_PATH: /Linkpoint/ }
      - name: Smoke-test generated entry points
        run: test -s apps/linkpoint/dist/index.html && test -s apps/linkpoint/dist/service-worker.js && test -s apps/linkpoint/dist/manifest.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/linkpoint/dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy immutable build
        id: deployment
        uses: actions/deploy-pages@v4
