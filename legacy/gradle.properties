# Project-wide Gradle settings.
# Heavily commented to help new contributors.

# JVM memory: increase if running out of memory during build
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

# Parallel and on-demand configuration speeds up builds
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX migration settings (keep enabled)
android.useAndroidX=true
# Jetifier disabled - all dependencies are AndroidX compatible
# Enabling Jetifier causes build failures with Java 21 compiled libraries (e.g., sceneview)
android.enableJetifier=false

# Smaller R classes, faster builds
android.nonTransitiveRClass=true

# Optimize resource processing
android.enableResourceOptimizations=true

# Suppress warning when building with the very latest SDK
# We intentionally target/compile SDK 35.
android.suppressUnsupportedCompileSdk=35

# Build performance
org.gradle.caching=true
org.gradle.daemon=true

# === AAPT2 CONFIGURATION - USING SDK DEFAULT ===
# Using standard SDK AAPT2 for maximum compatibility
# Removed custom AAPT2 override that was causing build failures
# This allows AGP to manage AAPT2 internally for stable builds
# === END CONFIGURATION ===

# Compatibility settings for build stability
# android.disableResourceValidation=true
# android.enableBuildCache - Deprecated in AGP 7.0+, removed
kapt.incremental.apt=true
kapt.use.worker.api=false

# NOTE: Keep machine-local proxy/SDK overrides in local.properties or GRADLE_USER_HOME and out of git-tracked files to avoid merge conflicts.
