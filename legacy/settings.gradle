include('llsd-core')
project(':llsd-core').projectDir = file('LLSD-KOTLIN')

def skipAndroid = (providers.gradleProperty('skipAndroid').orNull == 'true') ||
                  (System.getenv('LINKPOINT_SKIP_ANDROID') == 'true')

def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
def ndkRoot = System.getenv('ANDROID_NDK_ROOT') ?: System.getenv('ANDROID_NDK_HOME')

if (sdkDir == null) {
    def localPropsFile = file('Linkpoint/local.properties').exists() ? file('Linkpoint/local.properties') :
                         (file('local.properties').exists() ? file('local.properties') : null)
    if (localPropsFile != null) {
        def props = new Properties()
        localPropsFile.withInputStream { props.load(it) }
        sdkDir = props.getProperty('sdk.dir')
        if (ndkRoot == null) {
            ndkRoot = props.getProperty('ndk.dir')
        }
    }
}

def hasNdk26 = (sdkDir != null && file("${sdkDir}/ndk/26.3.11579264").exists()) ||
               (ndkRoot != null && file(ndkRoot).exists() && (file(ndkRoot).name == '26.3.11579264' || file("${ndkRoot}/source.properties").text?.contains('26.3.11579264')))

def hasCompleteSdk = !skipAndroid &&
                     sdkDir != null &&
                     file("${sdkDir}/platforms/android-35").exists() &&
                     hasNdk26

if (hasCompleteSdk && file('Linkpoint').exists()) {
    includeBuild('Linkpoint')
}

