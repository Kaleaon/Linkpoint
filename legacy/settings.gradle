include('llsd-core')
project(':llsd-core').projectDir = file('LLSD-KOTLIN')

def resolveAndroidSdkDir = {
    def localProps = new Properties()
    for (loc in ['Linkpoint/local.properties', 'local.properties', '../local.properties']) {
        def f = file(loc)
        if (f.exists()) {
            f.withInputStream { localProps.load(it) }
            if (localProps.getProperty('sdk.dir')) {
                return file(localProps.getProperty('sdk.dir'))
            }
        }
    }
    def envHome = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (envHome) {
        return file(envHome)
    }
    return null
}

def skipAndroid = System.getenv('LINKPOINT_SKIP_ANDROID') == '1' ||
                  System.getenv('LINKPOINT_SKIP_ANDROID') == 'true' ||
                  System.getenv('SKIP_ANDROID_BUILD') == '1' ||
                  providers.gradleProperty('skipAndroidBuild').orNull == 'true' ||
                  providers.gradleProperty('skipAndroid').orNull == 'true'

def sdkDir = resolveAndroidSdkDir()
def ndkRoot = System.getenv('ANDROID_NDK_ROOT') ?: System.getenv('ANDROID_NDK_HOME')
if (sdkDir != null && ndkRoot == null) {
    def localPropsFile = file('Linkpoint/local.properties').exists() ? file('Linkpoint/local.properties') :
                         (file('local.properties').exists() ? file('local.properties') : null)
    if (localPropsFile != null) {
        def props = new Properties()
        localPropsFile.withInputStream { props.load(it) }
        ndkRoot = props.getProperty('ndk.dir')
    }
}

def hasNdk26 = (sdkDir != null && new File(sdkDir, 'ndk/26.3.11579264').exists()) ||
               (ndkRoot != null && file(ndkRoot).exists() && (
                   file(ndkRoot).name == '26.3.11579264' ||
                   new File(file(ndkRoot), 'source.properties').with { it.exists() && it.text.contains('26.3.11579264') }
               ))

def hasCompleteSdk = !skipAndroid &&
                     sdkDir != null &&
                     sdkDir.exists() &&
                     new File(sdkDir, 'platforms/android-35').exists() &&
                     hasNdk26

if (hasCompleteSdk && file('Linkpoint').exists()) {
    includeBuild('Linkpoint')
}

