# Robolectric runtime configuration shared by every JVM unit test that uses
# AndroidJUnit4 / RobolectricTestRunner.
#
# - sdk: pin to API 33 so Log/Resources shadows match production targetSdk.
#   Robolectric 4.11.x supports up to API 34, but pinning to 33 avoids the
#   stricter SDK 34 manifest checks that some library-only modules trip on.
# - application: use the inert RobolectricTestApp instead of the real
#   LinkpointApp. The real Application's onCreate touches the encrypted
#   keystore, conscrypt, and several native libraries that don't exist on
#   the JVM test classpath, so Robolectric's automatic bootstrap would
#   crash for every test that loads a Context.
sdk=33
application=com.linkpoint.testing.RobolectricTestApp
