[workspace]
resolver = "2"
members = [
    "crates/linkpoint-core",
    "crates/linkpoint-protocol",
    "crates/linkpoint-assets",
    "crates/linkpoint-scene",
    "crates/linkpoint-cache",
    "crates/linkpoint-tauri",
]
exclude = ["apps/linkpoint/src-tauri", "crates/quick-xml"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde-llsd-benthic = "0.3.3"
thiserror = "2"
url = "2"

[patch.crates-io]
quick-xml = { path = "crates/quick-xml" }
