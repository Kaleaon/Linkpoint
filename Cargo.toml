[workspace]
resolver = "2"
members = [
    "crates/linkpoint-core",
    "crates/linkpoint-protocol",
    "crates/linkpoint-assets",
    "crates/linkpoint-scene",
    "crates/linkpoint-cache",
    "crates/linkpoint-tauri",
]
exclude = ["apps/linkpoint/src-tauri", "LLSD-KOTLIN/src/main/rust", "crates/quick-xml", "crates/serde-llsd-benthic"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde-llsd-benthic = "0.3.3"
thiserror = "2"
url = "2"

[patch.crates-io]
quick-xml = { path = "crates/quick-xml" }
serde-llsd-benthic = { path = "crates/serde-llsd-benthic" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
