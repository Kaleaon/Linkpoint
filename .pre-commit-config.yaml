exclude: '^(legacy/|crates/quick-xml/tests/documents/|.*message_template\.msg$)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: '^(apps/linkpoint/src/)'
        exclude: '^(apps/linkpoint/src/linkpoint/(camera-3d|circuit-context|coordinate-normalizer|graphics-3d|scene-3d|world)\.ts)$'
      - id: end-of-file-fixer
        files: '^(apps/linkpoint/src/)'
        exclude: '.*message_template\.msg$'
      - id: check-yaml
        exclude: '^(legacy/|crates/quick-xml/|platforms/)'
      - id: check-json
        exclude: '^(legacy/|crates/quick-xml/|platforms/)'
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        name: ruff check
        files: '^(scripts/|tools/|.*\.py$)'
      - id: ruff-format
        name: ruff format
        files: '^(scripts/|tools/|.*\.py$)'

  - repo: local
    hooks:
      - id: parity-snapshot-guard
        name: parity snapshot scripts enforce clean tree
        entry: bash scripts/check_parity_snapshot_guards.sh
        language: system
        pass_filenames: false

      - id: dart-format
        name: dart format (packages/linkpoint_dart)
        entry: bash -c 'cd packages/linkpoint_dart && dart format --output=none --set-exit-if-changed .'
        language: system
        files: '^packages/linkpoint_dart/'
        pass_filenames: false

      - id: flutter-analyze
        name: flutter analyze (packages/linkpoint_dart)
        entry: bash -c 'cd packages/linkpoint_dart && flutter analyze'
        language: system
        files: '^packages/linkpoint_dart/'
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false

      - id: npm-typecheck
        name: npm run typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
