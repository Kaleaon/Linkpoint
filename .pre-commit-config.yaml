exclude: '^(android-sdk/|secondlife_decompiled/|lumiya_extracted/|lumiya_decompiled_source/|disassembled-apps/|Gauss/|vendor/|file_bundle/|apk_analysis/|cmdline-temp/|builds/|ktheme-pr/|.*message_template\.msg$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: '^(apps/linkpoint/src/)'
        exclude: '^(apps/linkpoint/src/linkpoint/(camera-3d|circuit-context|coordinate-normalizer|graphics-3d|scene-3d|world)\.ts)$'
      - id: end-of-file-fixer
        files: '^(apps/linkpoint/src/)'
        exclude: '.*message_template\.msg$'
      - id: end-of-file-fixer
        files: '^(apps/linkpoint/src/)'
        exclude: '.*message_template\.msg$'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: parity-snapshot-guard
        name: parity snapshot scripts enforce clean tree
        entry: bash scripts/check_parity_snapshot_guards.sh
        language: system
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false

      - id: npm-typecheck
        name: npm run typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
