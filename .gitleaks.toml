    '''Gauss''',
    '''vendor''',
    '''file_bundle''',
    '''apk_analysis''',
    '''cmdline-temp''',
    '''builds''',
    '''ktheme-pr''',
    '''Linkpoint/src/test/resources''',
    '''crates/quick-xml/tests/documents''',
    '''apps/linkpoint/public/avatar''',
    '''apps/linkpoint/firebase-applet-config.json''',
    '''apps/linkpoint/src/linkpoint/xmlrpc-client.test.ts''',
